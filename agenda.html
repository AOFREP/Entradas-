<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda · Eventos y Negocios</title>
<meta name="theme-color" content="#0D2846">
<style>
  :root { --noche: #0D2846; --azul: #173D62; --acero: #2E6190; --celeste: #BEE1FA; --crema: #F8F0C8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px; text-align: center; color: #FFFFFF;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(170deg, var(--noche) 0%, var(--azul) 45%, var(--acero) 100%);
  }
  .aof { width: 130px; }
  .pre { color: var(--crema); font-size: 12px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin: 12px 0 10px; }
  .eyn { width: 220px; max-width: 70vw; }
  .dato { margin-top: 18px; font-size: 15px; color: var(--celeste); }
  .caja { margin-top: 30px; max-width: 360px; background: rgba(255,255,255,.08); border: 1px solid rgba(190,225,250,.35); border-radius: 16px; padding: 22px 20px; }
  .caja h1 { margin: 0 0 8px; font-size: 22px; color: var(--crema); }
  .caja p { margin: 0; font-size: 15px; line-height: 1.5; color: #E6F1FB; }
  .btn { display: inline-block; margin-top: 18px; background: var(--crema); color: var(--noche); font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 10px; }
  .sponsor { margin-top: 40px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #DDEBF8; }
  .hit { width: 150px; margin-top: 8px; }
</style>
</head>
<body>
  <img class="aof" src="assets/logo-aofrep.png" alt="AOFREP">
  <div class="pre">presenta</div>
  <img class="eyn" src="assets/logo-eyn.png" alt="Eventos y Negocios">
  <div class="dato">Lunes 2 de noviembre · HIT Events Polo</div>
  <div class="caja">
    <h1>Agenda en preparación</h1>
    <p>Muy pronto vas a ver acá las charlas del día, quién las da y el almuerzo. Guardá este link: el día del evento se actualiza en vivo.</p>
    <a class="btn" href="./">Ir al sitio del evento</a>
  </div>
  <div class="sponsor">Main sponsor</div>
  <img class="hit" src="assets/logo-hit.png" alt="HIT Events">
</body>
</html>
