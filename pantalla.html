<html lang="es">
<head>

<style>
/* v1.20 · Pantallas del evento. pantalla.html?p=grandes | chicas | foyer | banner
   Se deja abierta (pantalla completa) en la compu de cada pantalla; se maneja desde la consola → 📺 Pantallas.
   El lienzo se arma a la medida exacta del pixel map y se escala si la ventana es distinta. */
:root { --noche: #071A33; --azul: #173D62; --acero: #2E6190; --celeste: #BEE1FA; --crema: #F8F0C8; --oro: #FFD35A; --vivo: #5BE39B; --tenue: rgba(255,255,255,.72); --linea: rgba(190,225,250,.28); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
body { font-family: "Barlow Condensed", "Arial Narrow", -apple-system, "Segoe UI", sans-serif; color: #fff; cursor: none; }
#lienzo { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: linear-gradient(155deg, #071A33 0%, #0E2C4F 45%, #1E4C79 100%); }
/* ── fondo con movimiento sutil ── */
.fondo { position: absolute; inset: 0; pointer-events: none; }
.orbe { position: absolute; border-radius: 50%; opacity: .55; will-change: transform; } /* sin filter:blur: el degradé ya es suave y la compu de la pantalla trabaja mucho menos */
.o1 { width: 60%; aspect-ratio: 1; left: -15%; top: -35%; background: radial-gradient(circle, #3C7FC0 0%, transparent 65%); animation: flota1 12s ease-in-out infinite; }
.o2 { width: 55%; aspect-ratio: 1; right: -18%; bottom: -40%; background: radial-gradient(circle, #2E6190 0%, transparent 65%); animation: flota2 12s ease-in-out infinite; }
.o3 { width: 35%; aspect-ratio: 1; left: 40%; top: 30%; background: radial-gradient(circle, rgba(248,240,200,.35) 0%, transparent 65%); animation: flota3 12s ease-in-out infinite; }
@keyframes flota1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(8%, 10%) scale(1.08); } }
@keyframes flota2 { 0%, 100% { transform: translate(0, 0) scale(1.05); } 50% { transform: translate(-10%, -6%) scale(.95); } }
@keyframes flota3 { 0%, 100% { transform: translate(0, 0); opacity: .35; } 50% { transform: translate(-12%, 8%); opacity: .6; } }
.brillo { position: absolute; top: -20%; bottom: -20%; width: 18%; left: -30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); transform: skewX(-18deg); animation: barre 12s ease-in-out infinite; }
@keyframes barre { 0% { left: -30%; } 30%, 100% { left: 130%; } }
.lineas { position: absolute; inset: 0; background-image: linear-gradient(rgba(190,225,250,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(190,225,250,.045) 1px, transparent 1px); background-size: var(--grilla) var(--grilla); mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }
/* ── marco: arriba logos, abajo sponsors ── */
.top { position: absolute; left: var(--pad); right: var(--pad); top: calc(var(--pad) * .55); display: flex; align-items: center; justify-content: space-between; z-index: 3; }
.top img { height: var(--logoTop); width: auto; display: block; }
.top .eynTop { height: calc(var(--logoTop) * 1.25); }
.pie { position: absolute; left: var(--pad); right: var(--pad); bottom: calc(var(--pad) * .5); display: flex; align-items: center; justify-content: space-between; gap: var(--pad); z-index: 3; }
.pie .g { display: flex; align-items: center; gap: calc(var(--pad) * .35); }
.pie small { font-size: var(--fsMini); letter-spacing: .3em; text-transform: uppercase; color: var(--celeste); font-weight: 700; white-space: nowrap; }
.pie .hit { height: calc(var(--logoPie) * 1.6); }
.pie .spo { height: calc(var(--logoPie) * .72); opacity: .85; }
.respira { animation: respira 6s ease-in-out infinite; }
@keyframes respira { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
.sinTop .top, .sinPie .pie { display: none; }
.sinEyn .eynTop { visibility: hidden; }
/* ── escena y transiciones ── */
#escena { position: absolute; inset: 0; z-index: 2; }
.v { position: absolute; inset: 0; padding: var(--padTop) var(--pad) var(--padPie); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.v.sale { animation: sale .7s ease both; }
@keyframes sale { to { opacity: 0; transform: scale(1.03); filter: blur(6px); } }
.a1, .a2, .a3, .a4, .a5 { animation: entra 1s cubic-bezier(.2,.8,.2,1) both; }
.a2 { animation-delay: .15s; } .a3 { animation-delay: .3s; } .a4 { animation-delay: .45s; } .a5 { animation-delay: .6s; }
@keyframes entra { from { opacity: 0; transform: translateY(calc(var(--u) * 3)); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
.sinEntrada .a1, .sinEntrada .a2, .sinEntrada .a3, .sinEntrada .a4, .sinEntrada .a5 { animation: none; }
.kick { font-size: var(--fsKick); letter-spacing: .42em; text-transform: uppercase; color: var(--celeste); font-weight: 700; padding-left: .42em; }
.h1 { font-size: var(--fsH1); font-weight: 800; line-height: .95; color: var(--crema); margin: calc(var(--u) * .6) 0 0; }
.h2 { font-size: var(--fsH2); font-weight: 700; line-height: 1.05; }
.txt { font-size: var(--fsTxt); color: var(--tenue); line-height: 1.25; }
.chip { display: inline-flex; align-items: center; gap: .4em; font-size: var(--fsMini); font-weight: 800; letter-spacing: .3em; text-transform: uppercase; padding: .35em .9em .35em 1.2em; border-radius: 99px; background: var(--vivo); color: #06301A; }
.chip i { width: .6em; height: .6em; border-radius: 50%; background: #06301A; animation: titila 1.2s ease-in-out infinite; }
@keyframes titila { 50% { opacity: .25; } }
/* countdown */
.cdK { font-size: var(--fsKick); letter-spacing: .35em; text-transform: uppercase; color: var(--celeste); font-weight: 700; padding-left: .35em; }
.cd { font-size: var(--fsCd); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; display: flex; justify-content: center; text-shadow: 0 0 calc(var(--u) * 4) rgba(190,225,250,.35); }
.cd span { display: inline-block; min-width: .52em; text-align: center; }
.cd span.sep { min-width: .3em; opacity: .55; animation: titila 1s steps(2) infinite; }
.cd span.cambia { animation: cae .45s cubic-bezier(.2,.8,.2,1); }
@keyframes cae { from { transform: translateY(-40%); opacity: 0; } to { transform: none; opacity: 1; } }
.cd.fin { font-size: var(--fsH1); color: var(--crema); }
.cdBox { margin-top: calc(var(--u) * 3); padding: calc(var(--u) * 1.6) calc(var(--u) * 4); border-radius: calc(var(--u) * 2.4); background: rgba(5,18,36,.45); border: 1px solid rgba(248,240,200,.28); box-shadow: inset 0 0 calc(var(--u) * 4) rgba(0,0,0,.35); }
/* bienvenida */
.eynG { width: var(--eynG); height: auto; margin-top: calc(var(--u) * 1.5); filter: drop-shadow(0 0 calc(var(--u) * 3) rgba(248,240,200,.2)); }
/* agenda */
.ag { display: grid; grid-template-columns: var(--agCols); gap: calc(var(--pad) * .6); width: 100%; align-items: stretch; text-align: left; }
.card { background: rgba(255,255,255,.07); border: 1px solid var(--linea); border-radius: calc(var(--u) * 2.4); padding: calc(var(--u) * 2.2) calc(var(--u) * 2.6); position: relative; overflow: hidden; }
.card.vivo { border-color: rgba(91,227,155,.65); background: linear-gradient(135deg, rgba(91,227,155,.14), rgba(255,255,255,.05)); }
.persona { display: flex; align-items: center; gap: calc(var(--u) * 2.4); margin-top: calc(var(--u) * 1.4); }
.foto { width: var(--foto); height: var(--foto); border-radius: 50%; object-fit: cover; border: calc(var(--u) * .45) solid var(--crema); flex: none; background: var(--azul); box-shadow: 0 0 0 calc(var(--u) * 1) rgba(248,240,200,.12); }
.ico { width: var(--foto); height: var(--foto); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--foto) * .5); background: rgba(255,255,255,.08); flex: none; }
.nom { font-size: var(--fsH2); font-weight: 800; line-height: 1; }
.rol { font-size: var(--fsTxt); color: var(--tenue); margin-top: calc(var(--u) * .5); line-height: 1.2; }
.tema { font-size: var(--fsTxt); color: var(--crema); font-weight: 700; margin-top: calc(var(--u) * 1); line-height: 1.15; }
.prox .k { font-size: var(--fsMini); letter-spacing: .32em; text-transform: uppercase; color: var(--celeste); font-weight: 700; }
.fila { display: flex; gap: calc(var(--u) * 1.6); align-items: center; padding: calc(var(--u) * 1.1) 0; border-top: 1px solid var(--linea); }
.fila:first-of-type { border-top: 0; }
.fila .hh { font-size: var(--fsTxt); font-weight: 800; color: var(--celeste); font-variant-numeric: tabular-nums; min-width: 3.1em; }
.fila .mini { width: calc(var(--foto) * .42); height: calc(var(--foto) * .42); border-radius: 50%; object-fit: cover; border: 2px solid var(--crema); flex: none; }
.fila .mi { width: calc(var(--foto) * .42); height: calc(var(--foto) * .42); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--foto) * .2); background: rgba(255,255,255,.08); flex: none; }
.fila b { display: block; font-size: var(--fsTxt); line-height: 1.05; }
.fila small { display: block; font-size: calc(var(--fsTxt) * .72); color: var(--tenue); margin-top: .15em; }
/* rotación (pura CSS, para que el MP4 quede en loop) */
.rot { position: relative; }
.rot > .ri { position: absolute; inset: 0; opacity: 0; }
.rot.n1 > .ri { opacity: 1; position: relative; }
.rot.n2 > .ri { animation: rot2 12s infinite; } .rot.n3 > .ri { animation: rot3 12s infinite; } .rot.n4 > .ri { animation: rot4 12s infinite; }
.rot > .ri:first-child { position: relative; }
.rot.n2 > .ri:nth-child(2) { animation-delay: -6s; }
.rot.n3 > .ri:nth-child(2) { animation-delay: -8s; } .rot.n3 > .ri:nth-child(3) { animation-delay: -4s; }
.rot.n4 > .ri:nth-child(2) { animation-delay: -9s; } .rot.n4 > .ri:nth-child(3) { animation-delay: -6s; } .rot.n4 > .ri:nth-child(4) { animation-delay: -3s; }
@keyframes rot2 { 0% { opacity: 0; transform: translateY(6%); } 4%, 46% { opacity: 1; transform: none; } 50%, 100% { opacity: 0; transform: translateY(-6%); } }
@keyframes rot3 { 0% { opacity: 0; transform: translateY(6%); } 3%, 30% { opacity: 1; transform: none; } 33.3%, 100% { opacity: 0; transform: translateY(-6%); } }
@keyframes rot4 { 0% { opacity: 0; transform: translateY(6%); } 2.5%, 22.5% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; transform: translateY(-6%); } }
/* agenda completa */
.comp { display: grid; grid-template-columns: var(--compCols); grid-template-rows: repeat(var(--compRows), auto); grid-auto-flow: column; column-gap: calc(var(--pad) * .6); width: 100%; text-align: left; margin-top: calc(var(--u) * 2); }
.comp .fila { border-top: 1px solid var(--linea); padding: calc(var(--u) * .8) 0; }
.comp .fila.pz { opacity: .6; } .comp .fila.en { color: var(--vivo); } .comp .fila.en .hh { color: var(--vivo); }
/* placa "ahora habla" */
.placa { display: flex; align-items: center; gap: calc(var(--pad) * .7); text-align: left; }
.placa .foto { width: var(--fotoG); height: var(--fotoG); border-width: calc(var(--u) * .7); }
.placa .nom { font-size: var(--fsH1); color: #fff; }
.placa .rol { font-size: var(--fsH3); }
.placa .tema { font-size: var(--fsH3); }
.anillo { position: relative; flex: none; }
.anillo::after { content: ""; position: absolute; inset: calc(var(--u) * -1.6); border-radius: 50%; border: calc(var(--u) * .35) solid rgba(91,227,155,.7); animation: onda 3s ease-out infinite; }
@keyframes onda { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
/* break */
.taza { font-size: var(--fsIco); line-height: 1; animation: respira 6s ease-in-out infinite; }
.vuelve { font-size: var(--fsH3); color: var(--crema); font-weight: 700; margin-top: calc(var(--u) * 1); }
.acomp { margin-top: calc(var(--u) * 3); display: flex; align-items: center; gap: calc(var(--u) * 2.4); justify-content: center; }
.acomp small { font-size: var(--fsMini); letter-spacing: .3em; text-transform: uppercase; color: var(--celeste); font-weight: 700; }
.acomp img { height: calc(var(--logoAcomp) * .55); opacity: .9; }
/* pregunta */
.preg { max-width: 92%; }
.comilla { font-size: calc(var(--fsH1) * 1.6); line-height: 1; color: var(--oro); font-weight: 800; height: .5em; margin-top: calc(var(--u) * 2.4); overflow: visible; }
.pregT { font-size: var(--fsPreg); font-weight: 700; line-height: 1.12; color: #fff; }
.quien { margin-top: calc(var(--u) * 2.2); font-size: var(--fsH3); color: var(--crema); font-weight: 700; }
.quien small { display: block; font-size: var(--fsTxt); color: var(--tenue); font-weight: 500; margin-top: .2em; }
/* sponsors */
.slides { position: relative; width: 100%; height: 100%; }
.slides .sl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; animation: slA 12s infinite; }
.slides .sl:nth-child(2) { animation-name: slB; } .slides .sl:nth-child(3) { animation-name: slC; }
@keyframes slA { 0% { opacity: 0; transform: scale(.96); } 3%, 47% { opacity: 1; transform: none; } 50%, 100% { opacity: 0; transform: scale(1.02); } }
@keyframes slB { 0%, 50% { opacity: 0; transform: scale(.96); } 53%, 72% { opacity: 1; transform: none; } 75%, 100% { opacity: 0; transform: scale(1.02); } }
@keyframes slC { 0%, 75% { opacity: 0; transform: scale(.96); } 78%, 97% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(1.02); } }
.slHit { width: var(--hitG); margin-top: calc(var(--u) * 2.5); }
.slDos { display: flex; gap: calc(var(--pad) * .8); align-items: center; margin-top: calc(var(--u) * 2.5); }
.slDos .piave { width: calc(var(--hitG) * .5); }
.slDos .aof { width: calc(var(--piaveG) * .9); } .slDos .eyn { width: calc(var(--piaveG) * .75); }
/* gracias */
.logosFila { display: flex; gap: calc(var(--pad) * .7); align-items: center; justify-content: center; margin-top: calc(var(--u) * 3); }
.logosFila img { height: var(--logoAcomp); } .logosFila .lgHit { height: calc(var(--logoAcomp) * 1.25); } .logosFila .lgSpo { height: calc(var(--logoAcomp) * .6); opacity: .9; }
/* sorteo */
.sGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(var(--premioMin), 1fr)); gap: calc(var(--u) * 1.6); width: 100%; margin-top: calc(var(--u) * 2.4); text-align: left; }
.premio { background: rgba(255,255,255,.08); border: 1px solid var(--linea); border-radius: calc(var(--u) * 1.8); padding: calc(var(--u) * 1.6) calc(var(--u) * 2); position: relative; }
.premio .n { font-size: var(--fsH3); font-weight: 800; line-height: 1.02; }
.premio .de { font-size: calc(var(--fsTxt) * .8); color: var(--celeste); margin-top: .2em; }
.premio .g { margin-top: .5em; font-size: var(--fsTxt); color: var(--vivo); font-weight: 700; }
.premio .g.pend { color: var(--tenue); font-weight: 500; }
.premio.listo { border-color: rgba(91,227,155,.55); background: rgba(91,227,155,.1); }
.premio .x { position: absolute; top: .6em; right: .8em; font-size: calc(var(--fsTxt) * .8); font-weight: 800; color: var(--noche); background: var(--crema); border-radius: 1em; padding: .05em .6em; }
.ruleta { position: relative; margin-top: calc(var(--u) * 3); width: 86%; height: calc(var(--fsRuleta) * 1.9); border-radius: calc(var(--u) * 2.4); background: rgba(5,18,36,.6); border: 2px solid rgba(248,240,200,.4); box-shadow: inset 0 0 calc(var(--u) * 5) rgba(0,0,0,.5); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.ruleta b { font-size: var(--fsRuleta); font-weight: 800; white-space: nowrap; }
.ruleta b.salta { animation: salta .12s ease-out; }
@keyframes salta { from { transform: translateY(-40%); opacity: .2; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
.ganador { font-size: var(--fsGan); line-height: .92; font-weight: 800; text-shadow: 0 0 calc(var(--u) * 5) rgba(255,211,90,.45); animation: zoom .9s cubic-bezier(.2,1.6,.4,1) both; margin-top: calc(var(--u) * 1); }
@keyframes zoom { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.gano { font-size: var(--fsH3); letter-spacing: .4em; text-transform: uppercase; color: var(--oro); font-weight: 800; padding-left: .4em; }
.lleva { margin-top: calc(var(--u) * 2.4); display: inline-block; font-size: var(--fsH3); font-weight: 800; background: var(--crema); color: var(--noche); border-radius: 2em; padding: .2em 1em; }
canvas#conf { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.estadoRed { position: absolute; right: 8px; bottom: 6px; z-index: 9; font: 12px -apple-system, sans-serif; color: rgba(255,255,255,.5); }
.arranque { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(5,18,36,.85); cursor: default; font-family: -apple-system, "Segoe UI", sans-serif; }
.arranque div { text-align: center; color: #fff; }
.arranque button { font: 700 22px -apple-system, sans-serif; border: 0; border-radius: 14px; padding: 16px 28px; background: #F8F0C8; color: #071A33; cursor: pointer; }
.arranque p { color: rgba(255,255,255,.7); font-size: 15px; margin-top: 14px; }
[hidden] { display: none !important; }

/* ═════ medidas ═════ */
.f-grandes { --compRows: 6; --compCols: 1fr 1fr; --u: 8.8px; --pad: 70px; --padTop: 120px; --padPie: 110px; --blur: 40px; --grilla: 88px; --logoTop: 46px; --logoPie: 46px; --fsMini: 20px; --fsKick: 30px; --fsH1: 104px; --fsH2: 62px; --fsH3: 46px; --fsTxt: 32px; --fsCd: 190px; --fsIco: 120px; --fsPreg: 66px; --fsRuleta: 120px; --fsGan: 150px;
  --eynG: 640px; --foto: 200px; --fotoG: 380px; --agCols: 1.25fr 1fr; --hitG: 760px; --piaveG: 560px; --logoAcomp: 90px; --premioMin: 380px; }
.f-chicas { --compRows: 6; --compCols: 1fr 1fr; --u: 7px; --pad: 40px; --padTop: 84px; --padPie: 80px; --blur: 30px; --grilla: 64px; --logoTop: 30px; --logoPie: 30px; --fsMini: 14px; --fsKick: 20px; --fsH1: 70px; --fsH2: 40px; --fsH3: 30px; --fsTxt: 22px; --fsCd: 130px; --fsIco: 84px; --fsPreg: 40px; --fsRuleta: 68px; --fsGan: 84px;
  --eynG: 420px; --foto: 130px; --fotoG: 220px; --agCols: 1fr; --hitG: 520px; --piaveG: 360px; --logoAcomp: 60px; --premioMin: 240px; }
.f-foyer { --compRows: 6; --compCols: 1fr 1fr; --u: 10.8px; --pad: 76px; --padTop: 140px; --padPie: 130px; --blur: 46px; --grilla: 96px; --logoTop: 48px; --logoPie: 48px; --fsMini: 20px; --fsKick: 30px; --fsH1: 110px; --fsH2: 64px; --fsH3: 46px; --fsTxt: 32px; --fsCd: 220px; --fsIco: 140px; --fsPreg: 72px; --fsRuleta: 120px; --fsGan: 150px;
  --eynG: 760px; --foto: 210px; --fotoG: 400px; --agCols: 1.15fr 1fr; --hitG: 820px; --piaveG: 600px; --logoAcomp: 96px; --premioMin: 360px; }
.f-banner { --compRows: 5; --compCols: 1fr; --u: 2.6px; --pad: 14px; --padTop: 120px; --padPie: 110px; --blur: 18px; --grilla: 32px; --logoTop: 22px; --logoPie: 26px; --fsMini: 11px; --fsKick: 13px; --fsH1: 40px; --fsH2: 26px; --fsH3: 20px; --fsTxt: 15px; --fsCd: 56px; --fsIco: 64px; --fsPreg: 20px; --fsRuleta: 24px; --fsGan: 34px;
  --eynG: 220px; --foto: 120px; --fotoG: 150px; --agCols: 1fr; --hitG: 220px; --piaveG: 210px; --logoAcomp: 40px; --premioMin: 200px; }
/* grandes: panorámica → bienvenida, break y placa en dos columnas */
.f-grandes .dosCol, .f-foyer .dosColG { flex-direction: row; gap: 110px; text-align: left; }
.f-grandes .dosCol .izq, .f-foyer .dosColG .izq { display: flex; flex-direction: column; align-items: flex-start; }
.f-grandes .dosCol .cdBox { margin-top: 0; }
/* chicas: una sola columna, lista rotando */
.f-chicas .ag .prox .fila { border-top: 0; }
/* banner vertical: todo apilado, sin textos chicos */
.f-banner .top { flex-direction: column; top: 16px; } .f-banner .top .aofTop { display: none; } .f-banner .top .eynTop { height: 70px; }

    box.innerHTML = '<div class="gano">🎉 ¡Ganó! 🎉</div><div class="ganador" style="font-size:calc(var(--fsGan)*' + f + ')">' + esc(a.nombre) + '</div>' + (a.empresa ? '<div class="h2" style="color:var(--celeste);margin-top:.3em">' + esc(a.empresa) + '</div>' : '') + '<div class="lleva">' + (P === 'banner' ? '' : 'Se lleva: ') + esc(a.premio) + '</div>';
    if (fiesta) { fanfarria(); confeti(); setTimeout(confeti, 1200); }
  }
  function sorConsultar() {
    clearTimeout(S.timer); if (vista().v !== 'sorteo' || QUIETO) return;
    F.get('sorteo', {}, 1).then(function (r) { S.d = r; if (!(r.actual && r.actual.ver)) S.rev = 0; sorPintar(); }).catch(function () { }).then(function () { S.timer = setTimeout(sorConsultar, 1500); });
  }

  // ── pintar con transición ──
  var clave = '';
  function pintar(forzar) {
    var e = vista(), k = e.v + '|' + (e.ts || '') + '|' + (e.k || '') + '|' + (e.titulo || '') + '|' + (e.hasta || '') + '|' + (e.speaker || '');
    if (k === clave && !forzar) return; clave = k;
    var b = (V[e.v] || V.agenda)(e), esc_ = $('escena'), vieja = esc_.querySelector('.v:not(.sale)');
    if (vieja) { vieja.classList.add('sale'); setTimeout(function () { vieja.remove(); }, 750); }
    var d = document.createElement('div'); d.className = 'v ' + (b.cls || ''); d.innerHTML = b.html; esc_.appendChild(d);
    lz.classList.toggle('sinPie', /sinPie/.test(b.cls || '')); lz.classList.toggle('sinEyn', /sinEyn/.test(b.cls || ''));
    tickCd();
    if (b.sorteo) { S.giro = S.giro || 0; S.rev = 0; S.girando = false; if (S.d) sorPintar(); sorConsultar(); }
  }
  setInterval(function () { tickCd(); if (vista().v !== 'sorteo' || !FORZADO) pintar(); }, 250);
  // la agenda automática cambia sola con la hora: se repinta cada 30 s por si cambió "ahora"
  setInterval(function () { var e = vista(); if (e.v === 'agenda') pintar(true); }, 30000);

  // ── consulta al sistema (cada 3 s; si no hay internet sigue con lo último) ──
  var fallos = 0;
  function consultar() {
    if (QUIETO || FORZADO) return;
    F.get('pantalla', {}, 1).then(function (r) { fallos = 0; $('red').textContent = ''; ESTADO = r; try { localStorage.setItem('fz_pant', JSON.stringify({ canales: r.canales })); } catch (e) { } pintar(); })
      .catch(function () { fallos++; if (fallos > 3) $('red').textContent = '· sin conexión: muestra lo último ·'; })
      .then(function () { setTimeout(consultar, 3000); });
  }
  pintar(true); consultar();
  if (!QUIETO && !FORZADO && !PREVIA) {
    $('arranque').hidden = false;
    $('bEmpezar').onclick = function () { $('arranque').hidden = true; audio(); if (ac && ac.resume) ac.resume(); try { var d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen).call(d); } catch (e) { } };
  }
  if (FORZADO && FORZADO.v === 'sorteo' && QUIETO) { S.d = { titulo: 'Sorteo', premios: [{ nombre: 'Kit de mate premium', de: 'HIT Events', cant: 1, ganadores: [] }, { nombre: 'Caja de vinos', cant: 2, ganadores: [] }, { nombre: 'Membresía AOFREP 2027', cant: 1, ganadores: [] }], req: [], nPart: 0 }; sorPintar(); }
  window.__pantalla = { P: P, W: W, H: H, pintar: pintar };
  // ⬇ PNG de lo que se ve (botón de la consola): se arma a la medida exacta de la pantalla
  if (Q.has('descargar')) {
    var avisoD = document.createElement('div'); avisoD.style.cssText = 'position:fixed;left:12px;top:12px;z-index:30;background:#F8F0C8;color:#071A33;font:600 15px -apple-system,sans-serif;padding:10px 14px;border-radius:10px';
    avisoD.textContent = 'Armando el PNG de ' + W + ' × ' + H + '…'; document.body.appendChild(avisoD);
    var sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload = function () {
      setTimeout(function () {
        lz.style.transform = 'none';
        // html2canvas no dibuja bien los SVG: los paso a PNG del tamaño exacto en que se ven
        var imgs = Array.prototype.filter.call(lz.querySelectorAll('img'), function (im) { return /\.svg/.test(im.src) && im.clientWidth; });
        Promise.all(imgs.map(function (im) { return new Promise(function (ok) {
          try { var c = document.createElement('canvas'), w = im.clientWidth, h = im.clientHeight; c.width = w * 2; c.height = h * 2; c.getContext('2d').drawImage(im, 0, 0, w * 2, h * 2); im.style.width = w + 'px'; im.style.height = h + 'px'; im.onload = function () { ok(); }; im.src = c.toDataURL('image/png'); setTimeout(ok, 1500); } catch (e) { ok(); }
        }); })).then(function () { return html2canvas(lz, { width: W, height: H, scale: 1, backgroundColor: '#071A33', useCORS: true, logging: false }).then(function (c) {
          var a = document.createElement('a'); a.download = 'pantalla-' + P + '-' + (FORZADO ? FORZADO.v : 'vista') + '-' + W + 'x' + H + '.png'; a.href = c.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove();
          avisoD.textContent = '✓ PNG descargado (' + W + ' × ' + H + '). Ya podés cerrar esta pestaña.'; escalar();
        }); }).catch(function (e) { avisoD.textContent = 'No se pudo armar el PNG: ' + e.message; escalar(); });
      }, 2200);
    };
    sc.onerror = function () { avisoD.textContent = 'No se pudo cargar la herramienta para el PNG (¿sin internet?).'; };
    document.head.appendChild(sc);
  }
})();
